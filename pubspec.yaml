name: sensitive_exposure_lint
description: >-
  Analyzer plugin that keeps secrets out of logs: a value annotated with
  @Sensitive must not be interpolated into a string, converted with toString,
  passed to a logging sink, or put into an exception message.
version: 1.0.0
repository: https://github.com/arxdeus/sensitive_exposure_lint
issue_tracker: https://github.com/arxdeus/sensitive_exposure_lint/issues

environment:
  sdk: ^3.13.2

resolution: workspace

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17
  analyzer_plugin_toolkit: ^1.0.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  # Only for the shared lint configuration in analysis_options.yaml, which is
  # a data file rather than code: nothing in lib/ imports arxdeus_lints.
  arxdeus_lints: ^1.0.0
  test: ^1.25.6
  test_reflective_loader: ^0.4.0
