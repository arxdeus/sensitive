name: sensitive
description: >-
  Analyzer plugin that keeps secrets out of logs. A value annotated with
  @Sensitive must not be interpolated, stringified, logged, or put into an
  exception message.
version: 1.0.0
homepage: https://github.com/arxdeus/sensitive
repository: https://github.com/arxdeus/sensitive
issue_tracker: https://github.com/arxdeus/sensitive/issues

funding:
  - https://ko-fi.com/arxdeus

topics:
  - analyzer-plugin
  - lints
  - static-analysis
  - security

environment:
  sdk: ^3.13.2

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  analyzer_plugin: ^0.14.17
  analyzer_plugin_toolkit: ^1.0.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  arxdeus_lints: ^1.0.0
  test: ^1.25.6
  test_reflective_loader: ^0.4.0
